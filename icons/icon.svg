<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- レッスンスケジュールのアイコン:青緑の背景に、色分けされた予定の入ったカレンダーと音符 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b8a6"/>
      <stop offset="1" stop-color="#0c6b62"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- カレンダーの紙 -->
  <rect x="196" y="262" width="632" height="560" rx="76" fill="#ffffff"/>
  <!-- 上の帯 -->
  <path d="M196 338a76 76 0 0 1 76-76h480a76 76 0 0 1 76 76v62H196z" fill="#f2c94c"/>
  <!-- とじ具 -->
  <rect x="340" y="200" width="56" height="132" rx="28" fill="#0c6b62"/>
  <rect x="628" y="200" width="56" height="132" rx="28" fill="#0c6b62"/>

  <!-- 予定のマス(種類の色) -->
  <g>
    <rect x="252" y="452" width="148" height="96" rx="20" fill="#4caf50"/>
    <rect x="438" y="452" width="148" height="96" rx="20" fill="#e3f1ee"/>
    <rect x="624" y="452" width="148" height="96" rx="20" fill="#56ccf2"/>
    <rect x="252" y="582" width="148" height="96" rx="20" fill="#e3f1ee"/>
    <rect x="438" y="582" width="148" height="186" rx="20" fill="#f2994a"/>
    <rect x="624" y="582" width="148" height="96" rx="20" fill="#e3f1ee"/>
    <rect x="252" y="712" width="148" height="56" rx="18" fill="#9b51e0"/>
    <rect x="624" y="712" width="148" height="56" rx="18" fill="#e3f1ee"/>
  </g>

  <!-- 音符(8分音符)。下にふちどり用の濃い形、上に白い形を重ねて、つなぎ目のないふちどりにする -->
  <g fill="#0c6b62" stroke="#0c6b62" stroke-width="44" stroke-linejoin="round">
    <path d="M832 468c44 24 100 54 118 116c10 36-2 78-28 108c12-54 0-98-56-124c-12-6-24-10-34-12z"/>
    <rect x="818" y="460" width="40" height="340" rx="20"/>
    <ellipse cx="752" cy="792" rx="96" ry="72" transform="rotate(-22 752 792)"/>
  </g>
  <g fill="#ffffff">
    <path d="M832 468c44 24 100 54 118 116c10 36-2 78-28 108c12-54 0-98-56-124c-12-6-24-10-34-12z"/>
    <rect x="818" y="460" width="40" height="340" rx="20"/>
    <ellipse cx="752" cy="792" rx="96" ry="72" transform="rotate(-22 752 792)"/>
  </g>
</svg>
