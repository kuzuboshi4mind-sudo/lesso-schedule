<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>レッスンスケジュール</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- 上の帯:月の表示と切り替えボタン -->
  <header class="app-header">
    <h1 id="month-title" class="month-title">----年--月</h1>
    <nav class="month-nav" aria-label="月の切り替え">
      <button type="button" id="prev-month" class="btn" aria-label="前の月">◀ 前月</button>
      <button type="button" id="this-month" class="btn btn-primary">今月</button>
      <button type="button" id="next-month" class="btn" aria-label="次の月">次月 ▶</button>
    </nav>
    <div class="legends">
      <!-- 種類と色の見本 -->
      <ul id="type-legend" class="type-legend" aria-label="種類の色"></ul>
      <!-- 状態の見本 -->
      <ul class="status-legend" aria-label="状態の見本">
        <li><span class="legend-lesson lesson confirmed">名前<span class="lesson-mark">○</span></span>確約</li>
        <li><span class="legend-lesson lesson tentative">名前</span>仮</li>
        <li><span class="legend-lesson lesson cancelled"><span class="lesson-mark">×</span><span class="lesson-name">名前</span></span>キャンセル</li>
        <li><span class="legend-lesson lesson none">予定</span>なし</li>
      </ul>
    </div>
  </header>

  <!-- 月表。この枠の中だけが縦横にスクロールする -->
  <main id="calendar-scroll" class="calendar-scroll">
    <table id="calendar" class="calendar"></table>
  </main>

  <!-- マスを長押しで選んだときの操作バー -->
  <div id="selection-bar" class="selection-bar" hidden>
    <span id="selection-info" class="selection-info"></span>
    <div class="selection-actions">
      <button type="button" id="sel-text" class="btn">文字を入力</button>
      <button type="button" id="sel-copy" class="btn">コピー</button>
      <button type="button" id="sel-paste" class="btn">貼り付け</button>
      <button type="button" id="sel-delete" class="btn btn-danger">削除</button>
      <button type="button" id="sel-done" class="btn btn-primary">完了</button>
    </div>
  </div>

  <!-- 短いお知らせ(「3件コピーしました」など) -->
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- 選んだマスに文字を直接入れる画面 -->
  <dialog id="text-dialog" class="sheet sheet-small">
    <form id="text-form" method="dialog">
      <h2>文字を入力</h2>
      <p id="text-target" class="sheet-note"></p>
      <label class="field">
        <span class="field-label">名前・内容</span>
        <input type="text" id="text-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </label>
      <div class="sheet-actions">
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>やめる</button>
        <button type="submit" class="btn btn-primary">入れる</button>
      </div>
    </form>
  </dialog>

  <!-- 予定(レッスン)の入力画面 -->
  <dialog id="lesson-dialog" class="sheet">
    <form id="lesson-form" method="dialog">
      <h2 id="lesson-dialog-title">予定を追加</h2>

      <div class="field-row">
        <label class="field">
          <span class="field-label">日付</span>
          <input type="date" id="lesson-date" required>
        </label>
        <label class="field">
          <span class="field-label">開始</span>
          <select id="lesson-start"></select>
        </label>
      </div>

      <div class="field">
        <label class="field-label" for="lesson-student">名前・内容</label>
        <input type="text" id="lesson-student" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="例:山田 / 練習">
        <!-- 前に入れた名前の候補(タップで入る) -->
        <div id="student-suggest" class="suggest" hidden></div>
      </div>

      <fieldset class="field">
        <legend class="field-label">状態</legend>
        <div id="lesson-statuses" class="chips"></div>
      </fieldset>

      <fieldset class="field">
        <legend class="field-label">長さ</legend>
        <div id="lesson-durations" class="chips"></div>
        <!-- 「終了時刻で指定」を選んだときだけ出る -->
        <label id="lesson-end-field" class="end-field" hidden>
          <span>終了</span>
          <select id="lesson-end"></select>
          <span id="lesson-end-length" class="end-length"></span>
        </label>
      </fieldset>

      <fieldset class="field">
        <legend class="field-label">種類</legend>
        <div id="lesson-types" class="chips"></div>
      </fieldset>

      <label class="field">
        <span class="field-label">メモ</span>
        <textarea id="lesson-memo" rows="2" placeholder="例:発表会の曲を練習"></textarea>
      </label>

      <p id="lesson-error" class="form-error" role="alert"></p>

      <div class="sheet-actions">
        <button type="button" id="lesson-delete" class="btn btn-danger">削除</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>やめる</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 日ごとのメモ(「予定」の行)の入力画面 -->
  <dialog id="note-dialog" class="sheet sheet-small">
    <form id="note-form" method="dialog">
      <h2><span id="note-date"></span> の予定</h2>
      <label class="field">
        <span class="field-label">メモ(例:サンパル、休み、ライブ)</span>
        <input type="text" id="note-text" autocomplete="off">
      </label>
      <div class="sheet-actions">
        <button type="button" id="note-clear" class="btn btn-danger">消す</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>やめる</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>
</body>
</html>
