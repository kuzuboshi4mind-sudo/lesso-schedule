<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>レッスンスケジュール</title>
  <style>
    /* 手順0の仮ページ。手順1で本物の画面に置き換える */
    :root {
      --bg: #f2f8f7;
      --text: #1d3b38;
      --accent: #138a7e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1d1c;
        --text: #dcefeb;
        --accent: #4fc4b6;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      text-align: center;
    }
    h1 { color: var(--accent); font-size: 1.6rem; margin: 0 0 .5rem; }
    p { margin: 0; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>レッスンスケジュール</h1>
    <p>準備中です(手順0)</p>
  </main>
</body>
</html>
