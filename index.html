<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>レッスンスケジュール</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- 上の帯:月の表示と切り替えボタン -->
  <header class="app-header">
    <h1 id="month-title" class="month-title">----年--月</h1>
    <nav class="month-nav" aria-label="月の切り替え">
      <button type="button" id="prev-month" class="btn" aria-label="前の月">◀ 前月</button>
      <button type="button" id="this-month" class="btn btn-primary">今月</button>
      <button type="button" id="next-month" class="btn" aria-label="次の月">次月 ▶</button>
    </nav>
  </header>

  <!-- 月表。この枠の中だけが縦横にスクロールする -->
  <main id="calendar-scroll" class="calendar-scroll">
    <table id="calendar" class="calendar"></table>
  </main>
</body>
</html>
